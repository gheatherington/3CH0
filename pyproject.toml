[project]
name = "3ch0"
version = "0.1.0"
description = "3CH0: personal CLI to inspect and download Echo360 recordings you can already view, with embedded subtitles and chapters."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Gavin Heatherington" }]
classifiers = [
    "Private :: Do Not Upload",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28",
    "certifi>=2024.8.30",
    "platformdirs>=4.3",
    "playwright>=1.49",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
# Local speech recognition. CTranslate2 runs on the CPU on macOS (no Metal backend).
# PyAV 17+ removed the open(metadata_errors=) argument that faster-whisper 1.2.1 passes.
transcribe = ["faster-whisper>=1.1", "av<17"]
# Apple Silicon GPU (Metal) backend via MLX. Heavier install (pulls PyTorch).
transcribe-mlx = ["mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
3ch0 = "threech0.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
]

[tool.uv]
# Rebuild the local package whenever its sources change (uv otherwise reuses a cached wheel
# for an unchanged pyproject.toml, so `uv tool install .` could install stale code).
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/threech0"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = [
    "S603",   # subprocess without shell: we always pass argument lists
    "S607",   # partial executable paths (ffmpeg/ffprobe resolved via PATH by design)
    "RUF001", "RUF002", "RUF003",  # intentional Unicode in UI text
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not live'"
timeout = 300
markers = [
    "ffmpeg: needs ffmpeg/ffprobe on PATH",
    "transcribe: needs an optional speech-recognition backend and model",
    "live: needs real Echo360 access (opt-in: -m live)",
]
